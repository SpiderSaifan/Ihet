<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ihet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bgaccent">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                Ihet
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="main.html">Home</a>
                <a class="nav-link" href="translator.html">Translator</a>
                <a class="nav-link" href="lang.html">The Ihet Language</a>
                <a class="nav-link" href="ranks.html">Ranks</a>
            </div>

        </div>
    </nav>
    <div class="d-flex flex-column align-items-center">
        <br><br>
        <h2>The Ihet Translator</h2>
        <br>
        <h3>The English to Ihet Translator is below:  </h3>
        <br><br>
        <div class="trans-con">
            <div class="trans-box">
                <input class="form-control" id="trans-in" type="text" placeholder="English Input">
            </div>
            <div class="trans-box">
                <p id="trans-out" style="font-family: Ihet;">Ihet Output</p>
            </div>
        </div>

        <br><br>
        <p class="text-center">or you can download the .exe setup for Windows <a href="downloads/IhetSetup.exe" download>here.</a><br> The guide for setting up the Ihet translator for Windows is <a target="_blank" href="guide.html">here.</a></h3>
        <br><br>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const input = document.getElementById("trans-in");
        const output = document.getElementById("trans-out");

        input.addEventListener("input", () => {
            output.innerText = input.value || "Ihet Output";
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
